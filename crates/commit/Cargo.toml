[package]
# The crate name `commit` is squatted on crates.io, so the package is published
# as `vcs-flow-commit`; the binary below is still named `commit` (`commit.exe`).
name = "vcs-flow-commit"
description = "Interactive TUI to stage-free pick changed files, preview diffs, and commit to git or jj."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["vcs", "jj", "jujutsu", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

# The installed/built binary is `commit` (`commit.exe`), independent of the
# crates.io package name above.
[[bin]]
name = "commit"
path = "src/main.rs"

[dependencies]
# Backend-agnostic facade: `Repo::open`/`detect` (replaces our own detection +
# Backend enum) and the common surface (current_branch, fetch, …), with the
# cwd-bound `repo.git_at()`/`repo.jj_at()` typed views for everything else.
vcs-core.workspace = true
# Typed jj client (`DiffSpec`, `FileDiff`, `JjFileset`, `Bookmark`/`BookmarkRef`)
# reached via `repo.jj_at()` for the operations the facade doesn't model
# (typed diff, reachable bookmarks, resolve list, op log).
vcs-jj.workspace = true
# Typed git client (`DiffSpec`, `FileDiff`, conflict classifiers) reached via
# `repo.git_at()` for diff, merge/rebase, rev-list, and the refspec push.
vcs-git.workspace = true
# Async runtime for the async `JjApi`/`GitApi` traits.
tokio.workspace = true
# Spawn the `copilot` CLI for AI message drafting inside a job, so the subprocess
# dies with the tool (same launcher the vcs clients use) — see `ai.rs`.
processkit.workspace = true
# Persist the chosen AI model in per-user / per-repo settings files (`settings.rs`).
serde.workspace = true
toml.workspace = true
dirs.workspace = true
# CLI arg parsing (`--dir`, `--amend`).
clap.workspace = true
# Terminal UI: framework, file tree, message editor (crossterm via `ratatui::crossterm`).
ratatui.workspace = true
tui-tree-widget.workspace = true
tui-textarea.workspace = true
# Syntax highlighting for the diff pane.
syntect.workspace = true
