[package]
# The crate name `commit` is squatted on crates.io, so the package is published
# as `vcs-flow-commit`; the binary below is still named `commit` (`commit.exe`).
name = "vcs-flow-commit"
description = "Interactive TUI to stage-free pick changed files, preview diffs, and commit to git or jj."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["vcs", "jj", "jujutsu", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

# The installed/built binary is `commit` (`commit.exe`), independent of the
# crates.io package name above.
[[bin]]
name = "commit"
path = "src/main.rs"

[dependencies]
# Typed jj client for jj/colocated repos; also re-exports `processkit` (the
# `Error`/`Result`/`ProcessResult` types and the `run`/`run_raw` escape hatch we
# use for diffs, templates, and revsets the 0.1 API doesn't cover).
vcs-jj.workspace = true
# Typed git client for git-only repos (status, current branch, commit + the
# `run` escape hatch for diffs/amend).
vcs-git.workspace = true
# Async runtime for the async `JjApi`/`GitApi` traits.
tokio.workspace = true
# CLI arg parsing (`--dir`, `--amend`).
clap.workspace = true
# Terminal UI: framework, file tree, message editor (crossterm via `ratatui::crossterm`).
ratatui.workspace = true
tui-tree-widget.workspace = true
tui-textarea.workspace = true
# Syntax highlighting for the diff pane.
syntect.workspace = true
